name: Create Android Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build
          prefix-key: release-aarch64-linux-android

      - name: Setup and patch egui dependency
        run: |
          pushd ..
          git clone --revision 44cdd653e2317d300fb8a6c9c36b03f23991e803 https://github.com/emilk/egui.git
          cd egui
          sed -i 's/ui.set_min_width(ui.available_width());/\/\/ ui.set_min_width(ui.available_width());/' crates/egui/src/containers/combo_box.rs
          popd
          echo 'egui = { path = "../egui/crates/egui" }' >> Cargo.toml
          echo 'egui_extras = { path = "../egui/crates/egui_extras" }' >> Cargo.toml

      - name: Build Android library
        env:
          HACHIMI_IGNORE_DIRTY: "true"
        run: |
          chmod +x tools/android/build.sh
          RELEASE=1 ./tools/android/build.sh

      - name: Upload Android library
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            build/*.so
            build/sha256.json

  create-release:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(awk '/^\[package\]/{flag=1} flag && /^version/{print $3; exit}' Cargo.toml | tr -d '"')
          echo "RELEASE_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "RELEASE_VERSION=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: android
          path: artifacts/android

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.RELEASE_VERSION }}
          name: Hachimi Android ${{ steps.version.outputs.RELEASE_VERSION }}
          prerelease: true
          files: artifacts/android/*
          body: |
            Private Android build of the no-translation Hachimi core.
            This release is for the repository owner only.
