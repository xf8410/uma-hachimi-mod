[package]
name = "hachimi"
version = "0.31.3"
edition = "2021"

[lib]
name = "hachimi"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1

[profile.dev]
debug = "limited"

[lints.clippy]
all = "allow"
perf = { level = "deny", priority = 1 }

[dependencies]
log = "0.4"
cstr = "0.2"
once_cell = "1.19"
chrono = "0.4.42"
arc-swap = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fnv = "1.0"
widestring = "1.1"
egui = { version = "0.33.3", default-features = false, features = ["serde"] }
egui-scale = "0.3.0"
egui_extras = { version = "0.33.3", default-features = false, features = ["image"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
png = "0.17"
sqlparser = "0.43"
textwrap = "0.16"
atomic_float = "0.1"
blake3 = "1.5"
ureq = { version = "3.2.0", features = ["json", "brotli"] }
http = "1.4.0"
size = "0.4"
memmap2 = "0.9.9"
thread-priority = "3.0.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
unicode-width = "0.1"
tiny_http = "0.12"
rust-i18n = "3.1"
sys-locale = "0.3.2"
simplelog = "0.12.2"
crossbeam-channel = "0.5"
egui_commonmark = { version = "0.22", features = ["better_syntax_highlighting"] }
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
procfs = "0.16"
jni = "0.21.1"
egui_glow = "0.33.3"
glow = "0.16"
dobby-rs = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windebug_logger = "0.1"
minhook = "0.5"
egui-directx11 = "0.12.1"
discord-rich-presence = "1.0.0"
pelite = "0.10"
microseh = "1.1"
webview2-com = "0.39.1"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_System_Tpm",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Xaml",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_IO",
    "Win32_UI_ViewManagement",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_WindowsRuntime",
    "Win32_System_Restore",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_System_Kernel",
    "Win32_System_Time",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_System_JobObjects",
    "Win32_System_IO"
]

[build-dependencies]
tauri-winres = "0.1"
cc = "1.1"

[package.metadata.tauri-winres]
ProductName = "Hachimi Edge"
FileDescription = "Game enhancement and translation mod"

[patch.crates-io]
dobby-sys = { git = "https://github.com/LeadRDRK/dobby-sys.git", rev = "e005f6abb0db1353b92ff58d50f59112f04dcad4" }
embed-resource = { git = "https://github.com/nabijaczleweli/rust-embed-resource.git", rev = "e98e9aa28d66b0c2ff43516b41847cac372310dd" }
